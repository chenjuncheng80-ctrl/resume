<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="900" height="675" fill="url(#bg)"/>
  <circle cx="450" cy="320" r="180" fill="url(#glow)"/>
  <g stroke="#8a8a8a" stroke-width="2" fill="none" opacity="0.85">
    <circle cx="450" cy="320" r="120"/>
    <circle cx="450" cy="320" r="60" stroke="#c8c8c8"/>
  </g>
  <g fill="#e6e6e6">
    <circle cx="450" cy="320" r="14"/>
    <circle cx="330" cy="230" r="6"/>
    <circle cx="585" cy="260" r="5"/>
    <circle cx="610" cy="400" r="7"/>
    <circle cx="300" cy="410" r="5"/>
    <circle cx="450" cy="160" r="6"/>
    <circle cx="520" cy="500" r="5"/>
    <circle cx="380" cy="500" r="6"/>
  </g>
  <g stroke="#6a6a6a" stroke-width="1.5">
    <line x1="450" y1="320" x2="330" y2="230"/>
    <line x1="450" y1="320" x2="585" y2="260"/>
    <line x1="450" y1="320" x2="610" y2="400"/>
    <line x1="450" y1="320" x2="300" y2="410"/>
    <line x1="450" y1="320" x2="450" y2="160"/>
    <line x1="450" y1="320" x2="520" y2="500"/>
    <line x1="450" y1="320" x2="380" y2="500"/>
  </g>
  <rect width="900" height="675" fill="url(#v)"/>
  <rect width="900" height="675" filter="url(#g)" opacity="0.05"/>
</svg>
